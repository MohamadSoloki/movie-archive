name: CI and release

on:
  push:
    tags: ['v*']
  # Actions tab -> CI and release -> Run workflow -> type the version (e.g. 0.4.1): no tag and no package.json edit needed
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.4.1 (must be higher than the previous release)"
        required: true

jobs:
  # A hand-started run (typed version) or a tag like v0.4.1 builds the Windows installer and the Linux AppImage and publishes them as one GitHub Release.
  # The version is written into package.json at build time, so the repo never needs a version-bump commit.
  # The installed app finds the release and offers the update itself. A hand-started run creates the tag v<version> itself (GitHub refuses a release without a tag).
  #
  # draft -> build (Windows and Linux in parallel) -> publish. The packager uploads through parallel publishers that each create a
  # missing release (422 already_exists), so the release is made here once, as a draft the builds reuse, and published only after every
  # file is uploaded: the updater never sees a half-uploaded release.
  draft:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # a second run for the same version would race the first and create a second release
    concurrency:
      group: release-${{ github.event.inputs.version || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like 0.4.1, got: $VERSION"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Use a higher version number."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # GitHub refuses to publish a release whose tag does not exist (422 "Published releases must have a valid tag"),
      # so a hand-started run makes the tag itself. A push made with GITHUB_TOKEN does not start another run.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="$GITHUB_SHA"
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --draft --title "$VERSION" --notes ""

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set the version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("version", pkg.version);
          '
      - run: npm ci
      - run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest

  # A failed run leaves nothing behind, so the same version can be run again. Only after the draft job passed: a run stopped
  # by "Release already exists" must never delete that earlier release.
  cleanup:
    needs: [draft, build, publish]
    if: failure() && needs.draft.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the unfinished release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          gh release delete "v$VERSION" --yes || true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" || true
          fi
