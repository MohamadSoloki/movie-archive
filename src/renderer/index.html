<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' poster: data:; style-src 'self'; script-src 'self'">
  <meta name="color-scheme" content="light dark">
  <title>Movie Archive</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></span>
      <h1 data-i18n="app_title"></h1>
      <span id="app-version" class="ver" dir="ltr"></span>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" data-i18n-placeholder="search_placeholder" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>

    <div class="actions">
      <button id="scan" type="button" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M16 16h5v5"/></svg><span data-i18n="scan"></span></button>
      <button id="fetch" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13v8"/><path d="m8 17 4 4 4-4"/><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/></svg><span data-i18n="fetch_info"></span></button>
    </div>
  </header>

  <nav id="side" class="side" aria-labelledby="side-title">
    <h2 id="side-title" class="sr" data-i18n="nav_label"></h2>
    <button id="folders-btn" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nav-label" data-i18n="folders"></span></button>
    <button id="cal-btn" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="nav-label" data-i18n="cal_btn"></span><span id="cal-badge" class="badge" hidden></span></button>
    <button id="pl-btn" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8"/><path d="M19 15v6M16 18h6"/></svg><span class="nav-label" data-i18n="pl_btn"></span></button>
    <button id="copy-btn" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg><span class="nav-label" data-i18n="copy_list"></span><span id="copy-badge" class="badge" hidden></span></button>
    <button id="cinema-list-btn" type="button" class="nav-btn" data-i18n-label="cat_title" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></svg><span class="nav-label" data-i18n="cat_title"></span></button>
    <button id="rep-btn" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="nav-label" data-i18n="rep_btn"></span><span id="rep-badge" class="badge" hidden></span></button>
    <span class="side-gap" aria-hidden="true"></span>
    <button id="update" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 4-4 4 4"/><path d="M12 16V8"/></svg><span class="nav-label" data-i18n="update_check"></span></button>
    <button id="settings-btn" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="nav-label" data-i18n="settings"></span></button>
    <button id="theme" type="button" class="nav-btn"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg><span class="nav-label" data-i18n="nav_theme"></span></button>
    <button id="lang" type="button" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg><span id="lang-label" class="nav-label"></span></button>
    <button id="side-toggle" type="button" class="nav-btn side-toggle" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-chev" d="m15 6-6 6 6 6"/></svg><span id="side-toggle-label" class="nav-label" data-i18n="nav_collapse"></span></button>
  </nav>

  <div id="upd-bar" class="upd" role="status" hidden></div>

  <div id="drop" class="drop" hidden><p data-i18n="drop_hint"></p></div>

  <main>
    <div id="filters">
      <div id="tabs" class="seg" role="tablist">
        <button type="button" role="tab" data-tab="all" data-i18n="tab_all"></button>
        <button type="button" role="tab" data-tab="movie" data-i18n="tab_movie"></button>
        <button type="button" role="tab" data-tab="series" data-i18n="tab_series"></button>
        <button type="button" role="tab" data-tab="animation" data-i18n="tab_animation"></button>
        <button type="button" role="tab" data-tab="anime" data-i18n="tab_anime"></button>
      </div>
      <button id="filter-open" type="button" class="btn filter-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span data-i18n="filters"></span><span id="filter-badge" class="badge" hidden></span></button>
      <button id="select-btn" type="button" class="btn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="select_mode"></span></button>
      <button id="manual-btn" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="manual_add"></span></button>
      <div id="active" class="chips"></div>
      <p id="count" class="count"></p>
    </div>
    <div id="grid"></div>
    <div id="empty" class="empty" hidden></div>
    <div id="sentinel"></div>
  </main>

  <section id="detail" hidden></section>

  <p id="status" role="status"></p>

  <dialog id="filter-dlg" class="sheet" aria-labelledby="filter-title">
    <header class="sheet-head">
      <h2 id="filter-title" data-i18n="filters_title"></h2>
      <button id="filter-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <section><h3 data-i18n="filter_status"></h3><div id="f-status" class="chips"></div></section>
      <section><h3 data-i18n="filter_quality"></h3><div id="f-quality" class="chips"></div></section>
      <section><h3 data-i18n="filter_genres"></h3><div id="f-genres" class="chips"></div></section>
      <section><h3 data-i18n="filter_countries"></h3><div id="f-countries" class="chips"></div></section>
      <section><h3 data-i18n="filter_tags"></h3><div id="f-tags" class="chips"></div></section>
      <section><h3 data-i18n="sort_label"></h3><div id="f-sort" class="seg"></div></section>
    </div>
    <footer class="sheet-foot">
      <button id="filter-clear" type="button" class="btn" data-i18n="filter_clear_all"></button>
      <button id="filter-show" type="button" class="btn primary" autofocus></button>
    </footer>
  </dialog>

  <dialog id="pl-dlg" class="sheet" aria-labelledby="pl-title">
    <header class="sheet-head">
      <h2 id="pl-title" data-i18n="pl_title"></h2>
      <button id="pl-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <p class="help" data-i18n="pl_hint"></p>
      <div class="field-row"><select id="pl-select" data-i18n-label="pl_title"></select><button id="pl-new" type="button" class="btn" data-i18n="pl_new"></button></div>
      <form id="pl-form" hidden>
        <label for="pl-name" data-i18n="pl_name"></label>
        <input id="pl-name" type="text" maxlength="80" dir="auto" required>
        <label for="pl-note" data-i18n="pl_note"></label>
        <textarea id="pl-note" rows="3" maxlength="500" dir="auto"></textarea>
        <div class="row">
          <button type="submit" class="btn primary" data-i18n="pl_save"></button>
          <button id="pl-delete" type="button" class="btn danger" data-i18n="pl_delete"></button>
        </div>
      </form>
      <p id="pl-msg" class="msg" role="alert"></p>
      <ol id="pl-items" class="plain pl-items"></ol>
      <div class="row"><button id="pl-copy" type="button" class="btn" data-i18n="pl_copy_all" hidden></button></div>
    </div>
  </dialog>
  <dialog id="pl-picker-dlg" class="sheet" aria-labelledby="pl-picker-title">
    <form id="pl-picker-form" class="sheet-form">
      <header class="sheet-head">
        <h2 id="pl-picker-title" data-i18n="pl_add"></h2>
        <button id="pl-picker-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="sheet-body">
        <p id="pl-picker-entry" dir="auto"></p>
        <div id="pl-picker-choices" role="group" data-i18n-label="pl_picker_choose"></div>
        <p id="pl-picker-note" class="help" role="status"></p>
      </div>
      <footer class="sheet-foot">
        <button id="pl-picker-add" type="submit" class="btn primary" data-i18n="pl_add" disabled></button>
      </footer>
    </form>
  </dialog>
  <dialog id="manual-dlg" class="sheet" aria-labelledby="manual-title">
    <header class="sheet-head">
      <h2 id="manual-title"></h2>
      <button id="manual-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <form id="manual-form" class="sheet-body">
      <p class="help" data-i18n="manual_hint"></p>
      <label for="m-file" id="m-file-label" data-i18n="manual_file"></label>
      <div class="field-row"><input id="m-file" type="text" dir="ltr" autocomplete="off"><button id="m-file-pick" type="button" class="btn" data-i18n="browse"></button></div>
      <label for="m-title" data-i18n="manual_title_field"></label>
      <input id="m-title" type="text" maxlength="200" dir="auto" required>
      <div class="price-fields">
        <label for="m-year" data-i18n="manual_year"></label>
        <input id="m-year" type="text" maxlength="9" dir="ltr" inputmode="numeric">
        <label for="m-kind" data-i18n="manual_kind"></label>
        <select id="m-kind"><option value="movie" data-i18n="manual_kind_movie"></option><option value="series" data-i18n="manual_kind_series"></option></select>
        <label for="m-runtime" data-i18n="manual_runtime"></label>
        <input id="m-runtime" type="text" maxlength="30" dir="auto">
        <label for="m-country" data-i18n="manual_country"></label>
        <input id="m-country" type="text" maxlength="120" dir="auto">
        <label for="m-director" data-i18n="director"></label>
        <input id="m-director" type="text" maxlength="200" dir="auto">
        <label for="m-actors" data-i18n="actors"></label>
        <input id="m-actors" type="text" maxlength="400" dir="auto">
      </div>
      <h3 data-i18n="genres"></h3>
      <div id="m-genres" class="chips" role="group"></div>
      <input id="m-genres-extra" type="text" maxlength="120" dir="auto" data-i18n-placeholder="manual_genres_extra" aria-label="genres">
      <label for="m-plot" data-i18n="plot"></label>
      <textarea id="m-plot" rows="4" maxlength="4000" dir="auto"></textarea>
      <label for="m-poster" data-i18n="manual_poster"></label>
      <div class="field-row"><input id="m-poster" type="text" dir="ltr" autocomplete="off"><button id="m-poster-pick" type="button" class="btn" data-i18n="browse"></button></div>
      <div id="m-newfile" hidden>
        <label for="m-file2" data-i18n="manual_newfile"></label>
        <div class="field-row"><input id="m-file2" type="text" dir="ltr" autocomplete="off"><button id="m-file2-pick" type="button" class="btn" data-i18n="browse"></button></div>
        <p class="help" data-i18n="manual_newfile_hint"></p>
      </div>
      <p id="manual-msg" class="msg" role="alert"></p>
      <div class="row">
        <button type="submit" class="btn primary" data-i18n="manual_save"></button>
        <button id="manual-cancel" type="button" class="btn" data-i18n="close"></button>
      </div>
    </form>
  </dialog>
  <dialog id="folders-dlg" class="sheet" aria-labelledby="folders-title">
    <header class="sheet-head">
      <h2 id="folders-title" data-i18n="folders"></h2>
      <button id="folders-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <ul id="roots" class="plain"></ul>
      <form id="add-root">
        <div class="field-row">
          <input id="root-path" type="text" autofocus dir="ltr" data-i18n-placeholder="folder_path_placeholder" aria-label="path">
          <button id="browse" type="button" class="btn" data-i18n="browse"></button>
        </div>
        <div class="row">
          <button type="submit" class="btn primary" data-i18n="add_folder"></button>
          <button id="add-single" type="button" class="btn" data-i18n="add_single"></button>
        </div>
        <p class="help" data-i18n="single_hint"></p>
        <p id="rail-msg" class="msg" role="alert"></p>
      </form>
    </div>
  </dialog>

  <dialog id="cal-dlg" class="sheet" aria-labelledby="cal-title">
    <header class="sheet-head">
      <h2 id="cal-title" data-i18n="cal_title"></h2>
      <button id="cal-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <p id="cal-note" class="help" role="status" hidden></p>
      <ul id="cal-items" class="plain"></ul>
      <p id="cal-empty" class="help" data-i18n="cal_empty"></p>
      <section>
        <h3 data-i18n="cal_new"></h3>
        <div id="cal-new"></div>
      </section>
    </div>
  </dialog>

  <dialog id="copy-dlg" class="sheet" aria-labelledby="copy-title">
    <header class="sheet-head">
      <div class="copy-heading">
        <span class="copy-heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm9 9-9 5-9-5m18 4-9 5-9-5"/></svg></span>
        <h2 id="copy-title" data-i18n="copy_list"></h2>
      </div>
      <button id="copy-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <div class="copy-layout">
        <section class="copy-queue" aria-labelledby="copy-queue-title">
          <div class="copy-section-head">
            <h3 id="copy-queue-title" data-i18n="copy_selected"></h3>
            <span id="copy-count" class="copy-count" aria-hidden="true">0</span>
          </div>
          <div class="copy-list-tools">
            <select id="copy-list" dir="auto" data-i18n-label="copy_lists" autofocus></select>
            <button id="copy-new" type="button" class="btn" data-i18n="copy_new_list"></button>
            <button id="copy-del" type="button" class="btn ghost" data-i18n="copy_delete_list"></button>
          </div>
          <ul id="copy-items" class="plain" aria-labelledby="copy-queue-title"></ul>
          <p id="copy-empty" class="copy-empty" data-i18n="copy_empty"></p>
        </section>
        <div class="copy-setup">
          <section aria-labelledby="copy-destination-title">
            <h3 id="copy-destination-title" data-i18n="copy_dest"></h3>
            <div class="copy-field">
              <label for="copy-name" data-i18n="copy_folder_name"></label>
              <input id="copy-name" name="folder" type="text" maxlength="100" dir="auto" autocomplete="off">
            </div>
            <div class="copy-field">
              <label for="copy-dest" data-i18n="copy_destination_folder"></label>
              <div class="field-row">
                <input id="copy-dest" name="destination" type="text" readonly dir="ltr" autocomplete="off" aria-describedby="copy-cap copy-eta" data-i18n-placeholder="copy_no_dest">
                <button id="copy-browse" type="button" class="btn" data-i18n="browse"></button>
              </div>
            </div>
            <div id="copy-removable" class="chips"></div>
            <p id="copy-cap" class="help" role="status"></p>
            <p id="copy-eta" class="help" role="status" hidden></p>
          </section>

          <section aria-labelledby="copy-customer-title">
            <h3 id="copy-customer-title" data-i18n="order_customer"></h3>
            <div class="copy-fields">
              <div class="copy-field">
                <label for="copy-customer" data-i18n="order_customer_ph"></label>
                <input id="copy-customer" name="customer" type="text" maxlength="80" dir="auto" list="customer-suggest" autocomplete="off">
              </div>
              <div class="copy-field">
                <label for="copy-phone" data-i18n="order_phone_ph"></label>
                <input id="copy-phone" name="phone" type="tel" maxlength="30" dir="ltr" autocomplete="off">
              </div>
              <div class="copy-field copy-note-field">
                <label for="copy-note" data-i18n="order_note_ph"></label>
                <input id="copy-note" name="note" type="text" maxlength="200" dir="auto" autocomplete="off">
              </div>
            </div>
            <p id="copy-debt" class="help bad copy-warning" role="status" hidden></p>
            <p id="copy-warn" class="help bad copy-warning" role="alert" hidden></p>
          </section>

          <div id="copy-price" role="status" hidden>
            <ul id="copy-price-lines" class="plain price-lines"></ul>
            <p id="copy-price-total" class="price"></p>
          </div>
        </div>
      </div>

      <section class="copy-history" aria-labelledby="copy-history-title">
        <div class="copy-section-head">
          <h3 id="copy-history-title" data-i18n="copies_title"></h3>
        </div>
        <ul id="copy-done" class="plain"></ul>
        <p id="copy-done-empty" class="copy-empty" data-i18n="copies_empty"></p>
      </section>
    </div>
    <footer class="sheet-foot copy-footer">
      <div class="copy-operation">
        <progress id="copy-bar" max="100" value="0" aria-labelledby="copy-title" hidden></progress>
        <p id="copy-msg" role="status" dir="auto"></p>
        <p id="copy-speed" class="help" role="status" hidden></p>
        <div id="copy-after" class="row" hidden></div>
      </div>
      <details class="copy-skipped" hidden>
        <summary data-i18n="copy_skipped_title"></summary>
        <ul id="copy-skipped" class="plain"></ul>
      </details>
      <div class="copy-footer-row">
        <p id="copy-info" class="help" role="status"></p>
        <div class="copy-actions">
          <button id="copy-clear" type="button" class="btn ghost" data-i18n="copy_clear"></button>
          <button id="copy-go" type="button" class="btn primary" data-i18n="copy_start"></button>
        </div>
      </div>
    </footer>
  </dialog>

  <dialog id="cinema-list-dlg" class="sheet" aria-labelledby="cinema-list-title">
    <header class="sheet-head">
      <h2 id="cinema-list-title" data-i18n="cat_title"></h2>
      <button id="cinema-list-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div id="cinema-list-body" class="sheet-body"></div>
  </dialog>

  <dialog id="rep-dlg" class="sheet" aria-labelledby="rep-title">
    <header class="sheet-head">
      <h2 id="rep-title" data-i18n="rep_title"></h2>
      <button id="rep-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <div id="rep-tabs" class="chips"></div>
      <div id="rep-body"></div>
    </div>
  </dialog>

  <dialog id="settings-dlg" class="sheet" aria-labelledby="settings-title">
    <form id="settings-form" class="sheet-form">
      <header class="sheet-head">
        <h2 id="settings-title" data-i18n="settings"></h2>
        <button id="settings-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="sheet-body">
        <h3 class="set-h" data-i18n="set_g_source"></h3>
        <label for="set-key" data-i18n="settings_omdb_key"></label>
        <input id="set-key" type="password" autofocus dir="ltr" autocomplete="off">
        <p class="help" data-i18n="settings_omdb_hint"></p>
        <h3 class="set-h" data-i18n="set_g_scan"></h3>
        <label for="set-patterns" data-i18n="settings_patterns"></label>
        <textarea id="set-patterns" rows="4" dir="ltr"></textarea>
        <p class="help" data-i18n="settings_patterns_hint"></p>
        <h3 class="set-h" data-i18n="set_g_translate"></h3>
        <label for="set-email" data-i18n="translate_email"></label>
        <input id="set-email" type="text" dir="ltr" autocomplete="off">
        <p class="help" data-i18n="translate_email_hint"></p>
        <label class="check"><input id="set-auto-translate" type="checkbox"><span data-i18n="settings_auto_translate"></span></label>
        <p class="help" data-i18n="settings_auto_translate_hint"></p>
        <button id="translate-now" type="button" class="btn" data-i18n="translate_now"></button>
        <h3 class="set-h" data-i18n="set_g_invoice"></h3>
        <label for="set-shop" data-i18n="price_shop"></label>
        <input id="set-shop" type="text" maxlength="80" dir="auto" autocomplete="off">
        <p class="help" data-i18n="price_title"></p>
        <div class="price-fields">
          <label for="set-price-movie" data-i18n="price_per_movie"></label>
          <input id="set-price-movie" type="number" min="0" step="any" inputmode="decimal" dir="ltr">
          <label for="set-price-season" data-i18n="price_per_season"></label>
          <input id="set-price-season" type="number" min="0" step="any" inputmode="decimal" dir="ltr">
          <label for="set-price-episode" data-i18n="price_per_episode"></label>
          <input id="set-price-episode" type="number" min="0" step="any" inputmode="decimal" dir="ltr">
        </div>
        <p class="help" data-i18n="price_hint"></p>
        <div class="calc">
          <h4 data-i18n="calc_title"></h4>
          <div class="price-fields">
            <label for="calc-movies" data-i18n="calc_movies"></label>
            <input id="calc-movies" type="number" min="0" step="1" inputmode="numeric" dir="ltr" value="0">
            <label for="calc-seasons" data-i18n="calc_seasons"></label>
            <input id="calc-seasons" type="number" min="0" step="1" inputmode="numeric" dir="ltr" value="0">
            <label for="calc-episodes" data-i18n="calc_episodes"></label>
            <input id="calc-episodes" type="number" min="0" step="1" inputmode="numeric" dir="ltr" value="0">
          </div>
          <p id="calc-out" class="calc-out" role="status" aria-live="polite"></p>
        </div>
        <h3 class="set-h" data-i18n="set_g_backup"></h3>
        <div class="row">
          <button id="backup-export" type="button" class="btn" data-i18n="backup_export"></button>
          <button id="backup-import" type="button" class="btn" data-i18n="backup_import"></button>
        </div>
        <p class="help" data-i18n="backup_hint"></p>
        <p id="backup-note" class="help" role="status" hidden></p>
        <h3 class="set-h" data-i18n="phone_title"></h3>
        <div class="row"><button id="phone-toggle" type="button" class="btn"></button></div>
        <p class="help" data-i18n="phone_hint"></p>
        <div id="phone-box" class="phone-box" hidden>
          <img id="phone-qr" alt="" width="160" height="160">
          <a id="phone-url" class="phone-link" dir="ltr"></a>
        </div>
        <p id="phone-note" class="help" role="status" hidden></p>
        <fieldset class="catalog-code-settings">
          <legend data-i18n="catalog_code_title"></legend>
          <label class="catalog-code-toggle">
            <input id="set-catalog-code" type="checkbox">
            <span data-i18n="catalog_code_enable"></span>
          </label>
          <div id="catalog-code-options">
            <label for="set-catalog-code-minutes" data-i18n="catalog_code_minutes"></label>
            <input id="set-catalog-code-minutes" name="catalogCodeMinutes" type="number" min="1" max="1440" step="1" dir="ltr" required aria-describedby="catalog-code-help">
            <p id="catalog-code-help" class="help" data-i18n="catalog_code_help"></p>
          </div>
          <p id="catalog-code-current" class="catalog-code-current" hidden>
            <span data-i18n="catalog_code_current"></span>
            <output id="catalog-code-number" dir="ltr" aria-live="polite"></output>
          </p>
        </fieldset>
        <div id="internet-box" hidden>
          <div class="row"><button id="internet-toggle" type="button" class="btn"></button></div>
          <p class="help" data-i18n="internet_hint"></p>
          <div id="internet-qr-box" class="phone-box" hidden>
            <img id="internet-qr" alt="" width="160" height="160">
            <p id="internet-url" dir="ltr"></p>
          </div>
          <p id="internet-note" class="help" role="status" hidden></p>
        </div>
      </div>
      <footer class="sheet-foot">
        <button id="settings-cancel" type="button" class="btn" data-i18n="close"></button>
        <button type="submit" class="btn primary" data-i18n="save"></button>
      </footer>
    </form>
  </dialog>

  <datalist id="tag-suggest"></datalist>
  <datalist id="customer-suggest"></datalist>

  <div id="print-area" class="print-area" aria-hidden="true"></div>

  <div id="selbar" class="selbar" hidden>
    <span id="sel-count" class="sel-count"></span>
    <button id="sel-all" type="button" class="btn ghost"></button>
    <input id="sel-tag" type="text" maxlength="30" list="tag-suggest" autocomplete="off" data-i18n-placeholder="sel_tag_placeholder" aria-label="tag">
    <button id="sel-tag-add" type="button" class="btn" data-i18n="sel_tag_add"></button>
    <button id="sel-tag-remove" type="button" class="btn" data-i18n="sel_tag_remove"></button>
    <button id="sel-copy" type="button" class="btn primary" data-i18n="sel_to_copy"></button>
    <button id="sel-done" type="button" class="btn ghost" data-i18n="sel_done"></button>
  </div>

  <script src="i18n.js"></script>
  <script src="timepicker.js"></script>
  <script src="timemath.js"></script>
  <script src="app.js"></script>
</body>
</html>
