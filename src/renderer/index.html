<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' poster: data:; style-src 'self'; script-src 'self'">
  <meta name="color-scheme" content="light dark">
  <title>Movie Archive</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></span>
      <h1 data-i18n="app_title"></h1>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" data-i18n-placeholder="search_placeholder" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>

    <div class="actions">
      <button id="scan" type="button" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M16 16h5v5"/></svg><span data-i18n="scan"></span></button>
      <button id="fetch" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13v8"/><path d="m8 17 4 4 4-4"/><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/></svg><span data-i18n="fetch_info"></span></button>
      <span class="sep" aria-hidden="true"></span>
      <button id="folders-btn" type="button" class="icon-btn" data-i18n-label="folders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button id="update" type="button" class="icon-btn" data-i18n-label="update_check"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 4-4 4 4"/><path d="M12 16V8"/></svg><span id="update-label" hidden></span></button>
      <button id="settings-btn" type="button" class="icon-btn" data-i18n-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
      <button id="theme" type="button" class="icon-btn" data-i18n-label="theme_toggle">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
      <button id="lang" type="button" class="btn ghost"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg><span id="lang-label"></span></button>
    </div>
  </header>

  <main>
    <div id="filters">
      <div id="tabs" class="seg" role="tablist">
        <button type="button" role="tab" data-tab="all" data-i18n="tab_all"></button>
        <button type="button" role="tab" data-tab="movie" data-i18n="tab_movie"></button>
        <button type="button" role="tab" data-tab="series" data-i18n="tab_series"></button>
      </div>
      <button id="filter-open" type="button" class="btn filter-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span data-i18n="filters"></span><span id="filter-badge" class="badge" hidden></span></button>
      <div id="active" class="chips"></div>
      <p id="count" class="count"></p>
    </div>
    <div id="grid"></div>
    <div id="empty" class="empty" hidden></div>
    <div id="sentinel"></div>
  </main>

  <section id="detail" hidden></section>

  <p id="status" role="status"></p>

  <dialog id="filter-dlg" class="sheet" aria-labelledby="filter-title">
    <header class="sheet-head">
      <h2 id="filter-title" data-i18n="filters_title"></h2>
      <button id="filter-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <section><h3 data-i18n="filter_status"></h3><div id="f-status" class="chips"></div></section>
      <section><h3 data-i18n="filter_genres"></h3><div id="f-genres" class="chips"></div></section>
      <section><h3 data-i18n="filter_tags"></h3><div id="f-tags" class="chips"></div></section>
      <section><h3 data-i18n="sort_label"></h3><div id="f-sort" class="seg"></div></section>
    </div>
    <footer class="sheet-foot">
      <button id="filter-clear" type="button" class="btn" data-i18n="filter_clear_all"></button>
      <button id="filter-show" type="button" class="btn primary" autofocus></button>
    </footer>
  </dialog>

  <dialog id="folders-dlg" class="sheet" aria-labelledby="folders-title">
    <header class="sheet-head">
      <h2 id="folders-title" data-i18n="folders"></h2>
      <button id="folders-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="sheet-body">
      <ul id="roots" class="plain"></ul>
      <form id="add-root">
        <div class="field-row">
          <input id="root-path" type="text" autofocus dir="ltr" data-i18n-placeholder="folder_path_placeholder" aria-label="path">
          <button id="browse" type="button" class="btn" data-i18n="browse"></button>
        </div>
        <div class="row">
          <button type="submit" class="btn primary" data-i18n="add_folder"></button>
          <button id="add-single" type="button" class="btn" data-i18n="add_single"></button>
        </div>
        <p class="help" data-i18n="single_hint"></p>
        <p id="rail-msg" class="msg" role="alert"></p>
      </form>
    </div>
  </dialog>

  <dialog id="settings-dlg" class="sheet" aria-labelledby="settings-title">
    <form id="settings-form" class="sheet-form">
      <header class="sheet-head">
        <h2 id="settings-title" data-i18n="settings"></h2>
        <button id="settings-x" type="button" class="icon-btn" data-i18n-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="sheet-body">
        <label for="set-key" data-i18n="settings_omdb_key"></label>
        <input id="set-key" type="password" autofocus dir="ltr" autocomplete="off">
        <p class="help" data-i18n="settings_omdb_hint"></p>
        <label for="set-patterns" data-i18n="settings_patterns"></label>
        <textarea id="set-patterns" rows="4" dir="ltr"></textarea>
        <p class="help" data-i18n="settings_patterns_hint"></p>
        <label for="set-ignore" data-i18n="settings_ignore"></label>
        <textarea id="set-ignore" rows="3" dir="ltr"></textarea>
        <p class="help" data-i18n="settings_ignore_hint"></p>
        <label for="set-collections" data-i18n="settings_collections"></label>
        <textarea id="set-collections" rows="3" dir="ltr"></textarea>
        <p class="help" data-i18n="settings_collections_hint"></p>
        <label for="set-email" data-i18n="translate_email"></label>
        <input id="set-email" type="text" dir="ltr" autocomplete="off">
        <p class="help" data-i18n="translate_email_hint"></p>
      </div>
      <footer class="sheet-foot">
        <button id="settings-cancel" type="button" class="btn" data-i18n="close"></button>
        <button type="submit" class="btn primary" data-i18n="save"></button>
      </footer>
    </form>
  </dialog>

  <datalist id="tag-suggest"></datalist>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
